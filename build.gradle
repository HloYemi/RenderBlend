plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.116'
}

// 从 gradle.properties 读取，找不到就用默认值（CI 上 gradle.properties 可能读不到）
def modId         = findProperty("mod_id")         ?: "renderblender"
def modName       = findProperty("mod_name")       ?: "RenderBlender"
def modVersion    = findProperty("mod_version")    ?: "1.1.0"
def modGroup      = findProperty("mod_group_id")   ?: "committee.nova.mods.renderblender"
def mcVersion     = findProperty("minecraft_version") ?: "1.21.1"
def neoVersion    = findProperty("neo_version")    ?: "21.1.146"
def pMappingsVer  = findProperty("parchment_mappings_version") ?: "2024.11.17"
def pMcVersion    = findProperty("parchment_minecraft_version") ?: "1.21.1"

version = mcVersion + "-" + modVersion
group = modGroup

base {
    archivesName = modName
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neoVersion
    parchment {
        mappingsVersion = pMappingsVer
        minecraftVersion = pMcVersion
    }

    mods {
        "${modId}" {
            sourceSet(sourceSets.main)
        }
    }
    runs {
        client {
            client()
            loadedMods = [mods."${modId}"]
        }
        server {
            server()
            loadedMods = [mods."${modId}"]
        }
    }
}

repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.parchmentmc.org' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    mavenCentral()
    maven { url = 'https://maven.aliyun.com/repository/public' }
}

dependencies {
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version: mcVersion,
            neo_version      : neoVersion,
            mod_id           : modId,
            mod_name         : modName,
            mod_license      : (findProperty("mod_license") ?: "LGPL-2.1"),
            mod_version      : modVersion,
            mod_authors      : (findProperty("mod_authors") ?: "cnlimiter, covers1624"),
            mod_description  : (findProperty("mod_description") ?: "Render API library derived from Re:Avaritia")
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}